name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  addon-linter:
    name: Community add-on linter
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run the Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: "./hass-addon"
